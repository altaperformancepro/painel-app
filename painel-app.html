<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL REP - ALTA PERFORMANCE (Executivo)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 
      === META TAGS PARA PWA (APP DE CELULAR) === 
    -->
    
    <!-- Cor da barra de status do navegador (Android) -->
    <meta name="theme-color" content="#005A9C">
    
    <!-- Link para o arquivo Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Tags para Apple (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Painel Rep">
    
    <!-- Ícone para Apple (iOS) - Usando placeholder -->
    <link rel="apple-touch-icon" href="https://placehold.co/180x180/005A9C/FFFFFF?text=PR&font=poppins">
    
    <!-- 
      === FIM DAS META TAGS PWA === 
    -->

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #EEEEEE; 
        }

        /* Estilos de Botão e Título 3D (mantidos) */
        .btn-3d {
            background-color: #005A9C; 
            box-shadow: 0 4px 0 #004175; 
            transition: all 0.15s ease-out;
        }
        .btn-3d:hover {
            background-color: #006BCF; 
            box-shadow: 0 3px 0 #004175;
            transform: translateY(-1px);
        }
        .btn-3d:active {
            background-color: #006BCF;
            box-shadow: 0 0 0 #004175;
            transform: translateY(3px);
        }
        
        .btn-3d-accent {
            background-color: #FF6600; 
            box-shadow: 0 4px 0 #CC5200; 
            transition: all 0.15s ease-out;
        }
        .btn-3d-accent:hover {
            background-color: #ff771a;
            box-shadow: 0 3px 0 #CC5200;
            transform: translateY(-1px);
        }
        .btn-3d-accent:active {
            background-color: #ff771a;
            box-shadow: 0 0 0 #CC5200;
            transform: translateY(3px);
        }

        .title-3d-primary {
            text-shadow: 
                2px 2px 0px rgba(0, 0, 0, 0.1),
                4px 4px 0px rgba(0, 0, 0, 0.08),
                6px 6px 0px rgba(0, 0, 0, 0.06),
                8px 8px 0px rgba(0, 0, 0, 0.04),
                10px 10px 0px rgba(0, 0, 0, 0.02);
            color: #00508a; 
        }
        
        .title-3d-secondary {
            text-shadow: 
                1px 1px 0px rgba(0, 0, 0, 0.08),
                2px 2px 0px rgba(0, 0, 0, 0.06),
                3px 3px 0px rgba(0, 0, 0, 0.04);
            color: #d15500; 
        }
    </style>
</head>
<!-- Layout compacto (p-4, mb-6, gap-4) mantido -->
<body class="flex flex-col items-center min-h-screen p-4 md:p-8">

    <div class="text-center mb-6 md:mb-12">
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-blue-900 title-3d-primary">PAINEL REP</h1>

    </div>

                <span class="block text-3xl sm:text-4xl mb-2 sm:mb-3">🏷️</span>
                LISTA DE PREÇOS MANTECORP
            </h2>
            <a href="https://altaperformancepro.github.io/LISTAPRECO/" target="_blank" rel="noopener noreferrer" 
               class="btn-3d text-white font-medium py-2 sm:py-3 px-5 sm:px-6 rounded-lg w-full text-center text-base sm:text-lg">
                Acessar Lista
            </a>
        </div>
        
        <!-- Card 2: Vídeo Rinosoro -->

            <h2 class="text-lg sm:text-xl font-semibold text-gray-800 mb-3 sm:mb-5 text-center uppercase">
                <span class="block text-3xl sm:text-4xl mb-2 sm:mb-3">🎥</span>
                LAVAGEM NASAL RINOSORO
            </h2>
            <a href="https://sistemashypera.github.io/videorinosorofinal/" target="_blank" rel="noopener noreferrer" 
               class="btn-3d-accent text-white font-medium py-2 sm:py-3 px-5 sm:px-6 rounded-lg w-full text-center text-base sm:text-lg">
                Ver Vídeo
            </a>
        </div>
        
        <!-- Card 3: Pedido PDV -->
        <div class="bg-white rounded-xl shadow-lg flex flex-col justify-between p-4 sm:p-6 transition-all duration-300 hover:shadow-xl hover:-translate-y-1">
            <h2 class="text-lg sm:text-xl font-semibold text-gray-800 mb-3 sm:mb-5 text-center uppercase">
                <span class="block text-3xl sm:text-4xl mb-2 sm:mb-3">🛒</span>
                PEDIDO PDV
            </h2>
            <a href="https://altaperformancepro.github.io/PEDIDO_MANTECORP/" target="_blank" rel="noopener noreferrer" 
               class="btn-3d text-white font-medium py-2 sm:py-3 px-5 sm:px-6 rounded-lg w-full text-center text-base sm:text-lg">

        </div>
        
        <!-- Card 4: Simulador Premiação -->
        <div class="bg-white rounded-xl shadow-lg flex flex-col justify-between p-4 sm:p-6 transition-all duration-300 hover:shadow-xl hover:-translate-y-1">
            <h2 class="text-lg sm:text-xl font-semibold text-gray-800 mb-3 sm:mb-5 text-center uppercase">
                <span class="block text-3xl sm:text-4xl mb-2 sm:mb-3">🏆</span>
                SIMULADOR PREMIAÇÃO
            </h2>
            <a href="https://altaperformancepro.github.io/simuladorpremiofull/" target="_blank" rel="noopener noreferrer" 
               class="btn-3d text-white font-medium py-2 sm:py-3 px-5 sm:px-6 rounded-lg w-full text-center text-base sm:text-lg">
                Acessar Simulador
            </a>
        </div>

    </div>

</body>
</html>
